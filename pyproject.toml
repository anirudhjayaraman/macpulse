[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "macverdict"
version = "0.2.0"
description = "Stop watching graphs: macverdict tells you why your Mac was slow this week and what to do about it. Slowdown blame, RAM verdict, battery forecast and MacBook Air throttling, from quiet background sampling."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anirudh Jayaraman" }]
keywords = ["macos", "macbook", "monitoring", "diagnostics", "performance", "battery", "launchd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/anirudhjayaraman/macverdict"
Source = "https://github.com/anirudhjayaraman/macverdict"
Issues = "https://github.com/anirudhjayaraman/macverdict/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
macverdict = "macverdict.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macverdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["docs"]
