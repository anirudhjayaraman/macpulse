[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "macpulse"
version = "0.1.1"
description = "Lightweight performance diagnostics and history for your Mac: CPU, memory pressure, swap, disk, battery health and thermals, with a health score, HTML reports and launchd scheduling."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anirudh Jayaraman" }]
keywords = ["macos", "macbook", "monitoring", "diagnostics", "performance", "battery", "launchd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/anirudhjayaraman/macpulse"
Source = "https://github.com/anirudhjayaraman/macpulse"
Issues = "https://github.com/anirudhjayaraman/macpulse/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
macpulse = "macpulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["docs"]
